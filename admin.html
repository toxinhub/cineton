<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>অ্যাডমিন</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{--bg:#12131a;--sf:#1c1e2b;--tx:#eceaf4;--mu:#9b98ad;--ac:#ff5d8f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Hind Siliguri',sans-serif;padding:20px;max-width:900px;margin:auto}
section{background:var(--sf);border-radius:14px;padding:16px;margin:14px 0}h2{margin:0 0 10px;font-size:1.15rem}
input,select,textarea,button{font:inherit;color:var(--tx);background:#12131a;border:1px solid #ffffff22;border-radius:10px;padding:8px 12px;width:100%;margin:4px 0}
button{width:auto;cursor:pointer;background:var(--ac);border-color:var(--ac);color:#fff}button.g{background:none;border-color:#ffffff33}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:560px){.r{grid-template-columns:1fr}}
.hit{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;cursor:pointer}.hit:hover{background:#ffffff12}
.hit img{width:40px;border-radius:6px}.mu{color:var(--mu);font-size:.9rem}#log{white-space:pre-wrap;font-size:.9rem;color:var(--mu)}
.it{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #ffffff14}
</style></head><body>
<h1>অ্যাডমিন প্যানেল</h1>
<section><h2>১. সংযোগ (শুধু এই ব্রাউজারে সংরক্ষিত হয়)</h2>
<input id="repo" placeholder="GitHub রিপো: username/repo-name">
<input id="tok" type="password" placeholder="GitHub fine-grained token (শুধু এই রিপোর Contents: Read & write)">
<input id="tk" placeholder="TMDB API key">
<input id="ok" placeholder="OMDb API key (IMDb রেটিংয়ের জন্য)">
<button id="sv">সংরক্ষণ ও ডেটা লোড</button> <span class="mu" id="st"></span></section>

<section><h2>২. একটা করে যোগ করুন</h2>
<input id="sq" placeholder="নাম লিখুন, যেমন: Dune (2021)"><div id="hits"></div>
<div id="f" hidden><b id="pt"></b>
<div class="r"><select id="fs"><option value="watched">দেখে ফেলেছি</option><option value="watchlist">দেখতে চাই</option></select>
<input id="fd" type="date"><input id="fr" type="number" min="0" max="10" step="0.5" placeholder="আমার রেটিং (১০ এর মধ্যে)"></div>
<textarea id="fc" rows="2" placeholder="আমার মন্তব্য"></textarea><button id="add">যোগ করুন</button></div></section>

<section><h2>৩. তালিকা থেকে একসাথে যোগ</h2>
<p class="mu">প্রতি লাইনে একটা নাম। সাল দিলে নির্ভুলতা বাড়ে: <code>Dune (2021)</code>। সাল ছাড়া হলে সম্ভাব্য ভুল ম্যাচে "যাচাই দরকার" চিহ্ন বসবে।</p>
<textarea id="bl" rows="8"></textarea>
<select id="bs"><option value="watched">সবই দেখে ফেলেছি</option><option value="watchlist">সবই দেখতে চাই</option></select>
<button id="bg">আনুন ও যোগ করুন</button><div id="log"></div></section>

<section><h2>৪. বর্তমান তালিকা</h2><div id="ls"></div></section>
<script>
const $=s=>document.querySelector(s),L=localStorage,IMG='https://image.tmdb.org/t/p/w92';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
['repo','tok','tk','ok'].forEach(k=>$('#'+k).value=L['mt_'+k]||'');
let data=[],sha='',pick=null;
const gh=(m,b)=>fetch(`https://api.github.com/repos/${$('#repo').value.trim()}/contents/data.json`,{method:m||'GET',headers:{Authorization:'Bearer '+$('#tok').value.trim(),Accept:'application/vnd.github+json'},body:b&&JSON.stringify(b)}).then(async r=>{if(!r.ok)throw Error(r.status+' '+(await r.json()).message);return r.json()});
async function load(){const r=await gh();sha=r.sha;data=JSON.parse(decodeURIComponent(escape(atob(r.content.replace(/\n/g,'')))));list()}
async function save(msg){const r=await gh('PUT',{message:msg,sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,1))))});sha=r.content.sha;list()}
$('#sv').onclick=async()=>{['repo','tok','tk','ok'].forEach(k=>L['mt_'+k]=$('#'+k).value.trim());try{await load();$('#st').textContent='✔ সংযুক্ত ('+data.length+'টি)'}catch(x){$('#st').textContent='✖ '+x.message}};
const T=(p)=>fetch('https://api.themoviedb.org/3'+p+(p.includes('?')?'&':'?')+'api_key='+$('#tk').value.trim()+'&language=en-US').then(r=>r.json());
const parse=s=>{const m=s.match(/^(.*?)\s*\((\d{4})\)\s*$/);return m?{t:m[1],y:m[2]}:{t:s.trim(),y:''}};
const yr=h=>(h.release_date||h.first_air_date||'').slice(0,4);
async function search(s){const {t,y}=parse(s);const r=(await T('/search/multi?query='+encodeURIComponent(t))).results||[];return {hits:r.filter(h=>h.media_type==='movie'||h.media_type==='tv'),y}}
async function build(h){const type=h.media_type,x=await T(`/${type}/${h.id}?append_to_response=credits,external_ids`);
 const imdbId=x.imdb_id||x.external_ids?.imdb_id;let imdb='';
 if(imdbId&&$('#ok').value.trim()){try{const o=await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${$('#ok').value.trim()}`).then(r=>r.json());if(o.imdbRating&&o.imdbRating!=='N/A')imdb=o.imdbRating}catch{}}
 const dir=type==='movie'?(x.credits?.crew||[]).filter(c=>c.job==='Director').map(c=>c.name).join(', '):(x.created_by||[]).map(c=>c.name).join(', ');
 return {id:type+'-'+h.id,type,title:x.title||x.name,year:yr(x),poster:x.poster_path||'',overview:x.overview||'',director:dir,cast:(x.credits?.cast||[]).slice(0,8).map(c=>c.name),imdb}}
let tm;$('#sq').oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const q=$('#sq').value;if(q.length<2)return;const {hits}=await search(q);
 $('#hits').innerHTML=hits.slice(0,6).map((h,i)=>`<div class="hit" data-i="${i}">${h.poster_path?`<img src="${IMG}${h.poster_path}" alt="">`:''}<div>${e(h.title||h.name)} <span class="mu">${yr(h)} · ${h.media_type==='tv'?'সিরিজ':'মুভি'}</span></div></div>`).join('');$('#hits').h=hits},400)};
$('#hits').onclick=ev=>{const h=ev.target.closest('.hit');if(!h)return;pick=$('#hits').h[h.dataset.i];$('#pt').textContent=(pick.title||pick.name)+' ('+yr(pick)+')';$('#f').hidden=false;$('#hits').innerHTML=''};
$('#add').onclick=async()=>{try{const m=await build(pick);Object.assign(m,{my_rating:$('#fr').value?+$('#fr').value:null,watched_on:$('#fd').value,comment:$('#fc').value,status:$('#fs').value,needs_review:false});
 if(data.some(d=>d.id===m.id))return alert('এটা আগেই আছে।');data.unshift(m);await save('Add '+m.title);$('#f').hidden=true;$('#sq').value=''}catch(x){alert(x.message)}};
$('#bg').onclick=async()=>{const lines=$('#bl').value.split('\n').map(s=>s.trim()).filter(Boolean),log=$('#log');log.textContent='';let ok=0;
 for(const s of lines){try{const {hits,y}=await search(s);let h=y?hits.find(h=>yr(h)===y):hits[0];if(!h){log.textContent+='✖ পাওয়া যায়নি: '+s+'\n';continue}
  const m=await build(h);if(data.some(d=>d.id===m.id)){log.textContent+='⏭ আগেই আছে: '+m.title+'\n';continue}
  Object.assign(m,{my_rating:null,watched_on:'',comment:'',status:$('#bs').value,needs_review:!y&&hits.length>1});data.unshift(m);ok++;log.textContent+='✔ '+m.title+' ('+m.year+')'+(m.needs_review?' ⚠ যাচাই দরকার':'')+'\n'}catch(x){log.textContent+='✖ '+s+': '+x.message+'\n'}}
 if(ok)try{await save('Bulk add '+ok+' titles');log.textContent+='\nসংরক্ষিত হয়েছে: '+ok+'টি'}catch(x){log.textContent+='সংরক্ষণ ব্যর্থ: '+x.message}};
function list(){$('#ls').innerHTML=data.map((m,i)=>`<div class="it"><span>${e(m.title)} <span class="mu">${e(m.year)} · ${m.status==='watched'?'দেখা':'তালিকায়'}${m.needs_review?' · ⚠':''}</span></span><span>${m.status==='watchlist'?`<button class="g" onclick="mv(${i})">দেখেছি</button> `:''}<button class="g" onclick="ed(${i})">রেটিং/মন্তব্য</button> <button class="g" onclick="rm(${i})">মুছুন</button></span></div>`).join('')}
async function rm(i){if(confirm(data[i].title+' মুছবেন?')){const t=data.splice(i,1)[0].title;await save('Remove '+t)}}
async function mv(i){data[i].status='watched';data[i].watched_on=new Date().toISOString().slice(0,10);await save('Watched '+data[i].title)}
async function ed(i){const r=prompt('রেটিং (০–১০):',data[i].my_rating??'');if(r===null)return;const c=prompt('মন্তব্য:',data[i].comment||'');if(c===null)return;const d=prompt('দেখার তারিখ (YYYY-MM-DD):',data[i].watched_on||'');if(d===null)return;Object.assign(data[i],{my_rating:r?+r:null,comment:c,watched_on:d,needs_review:false});await save('Edit '+data[i].title)}
if($('#tok').value&&$('#repo').value)load().then(()=>$('#st').textContent='✔ সংযুক্ত').catch(x=>$('#st').textContent='✖ '+x.message);
</script></body></html>
