<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12131a"><meta name="description" content="CineTon — Some of the films I've watched. Rest of the drama? I'm living it.">
<title>CineTon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Hind+Siliguri:wght@400;500;600&display=swap">
<style>
:root{--bg:#12131a;--sf:#1c1e2b;--tx:#eceaf4;--mu:#9b98ad;--ac:#ff5d8f;--gd:#f5c542;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f6f4fa;--sf:#fff;--tx:#1a1a24;--mu:#6b6880;color-scheme:light}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% -10%,#ff5d8f10,transparent 30%),var(--bg);color:var(--tx);font:16px/1.6 'Hind Siliguri',sans-serif}
header{padding:48px 20px 16px;max-width:1200px;margin:auto}
h1{font:800 clamp(2.2rem,7vw,4.5rem)/1 Fraunces,serif;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mu);margin:0;max-width:680px;font-size:clamp(.88rem,1.8vw,1rem);line-height:1.45}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.stat{background:var(--sf);border:1px solid #ffffff18;border-radius:10px;padding:5px 9px;color:var(--mu);font-size:.82rem}.stat b{color:var(--tx)}
.bar{position:sticky;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);top:0;z-index:5;background:var(--bg);padding:12px 20px;max-width:1200px;margin:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.views{display:flex;gap:4px;margin-left:auto}.views button{padding:8px 10px;line-height:1}.views button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tabs{display:flex;gap:6px}
button,select,input{font:inherit;color:var(--tx);background:var(--sf);border:1px solid #ffffff1f;border-radius:10px;padding:8px 14px}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input{flex:1;min-width:150px}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
main{max-width:1200px;margin:auto;padding:12px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}main.list{display:flex;flex-direction:column;gap:8px}main.list .c{display:grid;grid-template-columns:58px 1fr;min-height:78px;align-items:center}main.list .c img,main.list .c .ph{width:58px;height:78px;aspect-ratio:auto}main.list .ci{padding:8px 12px}main.list .bd{left:auto;right:8px;top:8px;font-size:.7rem}main.list .rv{right:8px;top:8px}main.list .ci b{padding-right:0;display:flex;align-items:center;gap:10px;min-width:0}main.list .ci b{padding-right:76px}main.list .ci b .list-rating{margin-left:auto;flex:0 0 auto;white-space:nowrap}main.list .c:hover{transform:none}
@media(min-width:700px){main{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.c{background:var(--sf);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;border:1px solid #ffffff18;padding:0;text-align:left;color:inherit;transition:transform .2s}
.c:hover{transform:translateY(-4px)}
.c img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#2a2d3f}
.ph{display:grid;place-items:center;color:var(--mu);padding:10px;text-align:center}
.ci{padding:10px 12px 12px}.ci b{display:block;line-height:1.3}.ci small{color:var(--mu)}
.bd{position:absolute;top:8px;left:8px;background:#000c;color:var(--gd);padding:2px 8px;border-radius:99px;font-size:.8rem}
.rv{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;padding:2px 8px;border-radius:99px;font-size:.75rem}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:60px 0}
dialog{border:0;border-radius:18px;background:var(--sf);color:var(--tx);max-width:760px;width:calc(100% - 24px);padding:0}
dialog::backdrop{background:#000b}
.m{display:grid;grid-template-columns:1fr;gap:16px;padding:20px}
@media(min-width:640px){.m{grid-template-columns:230px 1fr}}
.m img{width:100%;border-radius:12px}.m h2{font:800 1.8rem/1.2 Fraunces,serif;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips span{background:#ffffff14;padding:3px 10px;border-radius:99px;font-size:.9rem}
.cm{border-left:3px solid var(--ac);padding-left:12px;font-style:italic}
.x{float:right;margin:12px}
.skel{background:linear-gradient(100deg,var(--sf) 35%,#ffffff08 50%,var(--sf) 65%);background-size:300% 100%;animation:sh 1.2s infinite;border-radius:14px;aspect-ratio:2/3}@keyframes sh{to{background-position:-300% 0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}@media(max-width:600px){header{padding-top:32px;padding-bottom:14px}h1{font-size:clamp(2rem,11vw,3rem);margin-bottom:4px}.sub{font-size:.82rem;line-height:1.4;max-width:360px}.stats{margin-top:12px}.bar{padding:10px 12px}.bar input{order:3;flex-basis:100%;min-width:0}.views{order:2;margin-left:auto}.views button{padding:7px 9px}main{padding:12px 12px 50px;gap:12px}.ci{padding:8px 9px 10px}.ci b{font-size:.95rem}.ci small{font-size:.78rem}main.list .c{grid-template-columns:52px 1fr;min-height:70px}main.list .c img,main.list .c .ph{width:52px;height:70px}main.list .bd{right:8px;left:auto}}
</style></head><body>
<header><h1>CineTon</h1><p class="sub">Some of the films I've watched. Rest of the drama? I'm living it.</p><div id="stats" class="stats" aria-label="Statistics"></div></header>
<div class="bar">
 <div class="tabs"><button id="t-watched" class="on">Watched</button><button id="t-watchlist">Watchlist</button></div>
 <input id="q" type="search" placeholder="Search title, actor or director…" aria-label="Search">
 <select id="ty" aria-label="Type"><option value="all">All types</option><option value="movie">Movie</option><option value="tv">TV / Show</option></select>
 <select id="so" aria-label="Sort"><option value="new">Newest first</option><option value="my">My rating</option><option value="im">IMDb rating</option><option value="yr">Release year</option><option value="az">Title (A–Z)</option></select>
 <div class="views" role="group" aria-label="View"><button id="v-grid" class="on" aria-label="Grid view" title="Grid view">▦</button><button id="v-list" aria-label="List view" title="List view">☷</button></div>
</div>
<main id="g" aria-live="polite"></main>
<dialog id="d"><button class="x" onclick="d.close()" aria-label="Close">✕</button><div class="m" id="mb"></div></dialog>
<script>
const $=s=>document.querySelector(s),d=$('#d'),IMG='https://image.tmdb.org/t/p/w500';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=[],tab='watched',view=localStorage.getItem('cineton-view')||'grid';
function skeleton(){const g=$('#g');g.innerHTML=Array.from({length:12},()=>'<div class="skel" aria-hidden="true"></div>').join('')}
fetch('data.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{D=x;render()}).catch(()=>$('#g').innerHTML='<p class="empty">Couldn’t load your library.</p>');
const pic=m=>m.poster?`<img loading="lazy" decoding="async" src="${IMG}${e(m.poster)}" alt="${e(m.title)} poster" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:this.alt.replace(/ poster$/,'')}))">`:`<div class="ph">${e(m.title)}</div>`;
function applyView(){const g=$('#g');g.classList.toggle('list',view==='list');$('#v-grid').classList.toggle('on',view==='grid');$('#v-list').classList.toggle('on',view==='list')}
function render(){
 applyView();
 const q=$('#q').value.trim().toLowerCase(),ty=$('#ty').value,so=$('#so').value;
 let L=D.filter(m=>m.status===tab&&(ty==='all'||m.type===ty)&&(!q||[m.title,m.director,(m.cast||[]).join(' '),m.year].join(' ').toLowerCase().includes(q)));
 const n=v=>parseFloat(v)||0;
 L.sort({new:(a,b)=>(b.watched_on||'').localeCompare(a.watched_on||''),my:(a,b)=>n(b.my_rating)-n(a.my_rating),im:(a,b)=>n(b.imdb)-n(a.imdb),yr:(a,b)=>n(b.year)-n(a.year),az:(a,b)=>a.title.localeCompare(b.title)}[so]);
 const w=D.filter(m=>m.status==='watched'),wl=D.filter(m=>m.status==='watchlist'),rated=w.filter(m=>n(m.my_rating)>0),avg=rated.length?(rated.reduce((a,m)=>a+n(m.my_rating),0)/rated.length).toFixed(1):'—';$('#stats').innerHTML=`<span class="stat">Movie <b>${D.filter(m=>m.type==='movie').length}</b></span><span class="stat">TV <b>${D.filter(m=>m.type==='tv').length}</span><span class="stat">My average <b>${avg}</b></span><span class="stat">Rated <b>${rated.length}</b></span>`;
 $('#g').innerHTML=L.length?L.map(m=>`<button class="c" data-id="${e(m.id)}">${pic(m)}${m.imdb?`<span class="bd">★ ${e(m.imdb)}</span>`:''}<div class="ci"><b>${e(m.title)}${m.my_rating?`<span class="list-rating">★ ${e(m.my_rating)}</span>`:""}</b><small>${e(m.year)} · ${m.type==='tv'?'TV / Show':'Movie'}${m.my_rating?` · My ${e(m.my_rating)}/10`:''}</small></div></button>`).join(''):'<p class="empty">No titles found.</p>';
}
$('#g').onclick=ev=>{const c=ev.target.closest('.c');if(!c)return;const m=D.find(x=>x.id===c.dataset.id);
 $('#mb').innerHTML=`<div>${pic(m)}</div><div><h2>${e(m.title)}</h2><div class="chips"><span>${e(m.year)}</span><span>${m.type==='tv'?'TV / Show':'Movie'}</span>${m.imdb?`<span>IMDb ${e(m.imdb)}</span>`:''}${m.my_rating?`<span>My rating ${e(m.my_rating)}/10</span>`:''}${m.watched_on?`<span>Watched ${e(m.watched_on)}</span>`:''}</div>
 ${m.director?`<p><b>Director/Creator:</b> ${e(m.director)}</p>`:''}${(m.cast||[]).length?`<p><b>Cast:</b> ${m.cast.map(e).join(', ')}</p>`:''}
 <p>${e(m.overview)}</p>${m.comment?`<p class="cm">${e(m.comment)}</p>`:''}</div>`;d.showModal()};
d.onclick=ev=>{if(ev.target===d)d.close()};
['q','ty','so'].forEach(i=>$('#'+i).oninput=render);
['watched','watchlist'].forEach(t=>$('#t-'+t).onclick=()=>{tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id==='t-'+t));render()});
$('#v-grid').onclick=()=>{view='grid';localStorage.setItem('cineton-view',view);applyView()};
$('#v-list').onclick=()=>{view='list';localStorage.setItem('cineton-view',view);applyView()};
</script></body></html>
