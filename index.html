<script id="cineton-theme-prepaint-v1">
(()=>{try{const saved=localStorage.getItem("cineton-theme");document.documentElement.dataset.theme=saved==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}})();
</script>

<style id="cineton-critical-theme-first-paint-v1">
/* Avoid exposing the page while the long legacy stylesheet stack is still cascading. */
html:not(.cineton-styles-ready) body{visibility:hidden!important}
/* Resolve the saved theme before the browser can paint the page.
   Kept in <head>; later legacy palette declarations must not flash first. */
html[data-theme="light"]{
  color-scheme:light!important;
  --bg:#f2f5f0!important;--sf:#ffffff!important;--tx:#20352b!important;--mu:#586e60!important;
  --ac:#286c50!important;--gd:#397b5c!important;--line:#294b3718!important;--line-strong:#294b3733!important;
  --modal:#ffffff!important;--modal-overlay:#f2f5f0f2!important;--modal-backdrop:#14291f55!important;--modal-shadow:#14291f26!important;
}
html[data-theme="dark"]{
  color-scheme:dark!important;
  --bg:#101b18!important;--sf:#172722!important;--tx:#e8f0ea!important;--mu:#b4c4b9!important;
  --ac:#79b99a!important;--gd:#a6c99a!important;--line:#d5e5d91c!important;--line-strong:#d5e5d940!important;
  --modal:#1b2c25!important;--modal-overlay:#101b18f5!important;--modal-backdrop:#07100dbb!important;--modal-shadow:#030906a8!important;
}

  background-color:var(--bg)!important;color:var(--tx)!important;
}
</style>

<style id="industry-origin-tags-v1">

    word-break:break-word!important;
  }
  .bar>.select-wrap .select-menu button::after{
    flex:0 0 auto!important;
    margin-left:8px!important;

/* Preserved source layer: public-comments-typography-contrast-v2 */

/* Public comments — balanced desktop hierarchy with stronger warm-theme contrast. */
.public-comments{

}

.public-comment-composer input,
.public-comment-composer textarea{
  color:var(--tx)!important;

  line-height:1.52!important;
}
.public-comment-composer input::placeholder,
.public-comment-composer textarea::placeholder{
  color:var(--mu)!important;
  opacity:1!important;
}
.public-comment-submit{
  color:var(--ac)!important;
  opacity:1!important;
}
@media(max-width:639px){
  .public-comments{
    border-color:var(--line-strong)!important;
  }

    font-size:.64rem!important;
    letter-spacing:.035em!important;
  }
  .public-comments-count{font-size:.59rem!important}

  }
  .public-comment-composer input,
  .public-comment-composer textarea{
    font-size:.66rem!important;
    line-height:1.5!important;
  }
}

<script id="modal-title-google-search-controller-v1">
(()=> {
  const wireTitleSearch = () => {
    document.querySelectorAll('.cinemodal .detail-head h2').forEach(title => {
      if (title.dataset.googleSearchWired === 'true') return;
      const titleText = title.textContent.trim();
      if (!titleText) return;

      const subline = title.closest('.detail-head')?.querySelector('.subline');
      const year = subline?.textContent.trim().match(/^(\d{4})/)?.[1] || '';
      const query = year ? titleText + ' ' + year : titleText;

      title.dataset.googleSearchWired = 'true';
      title.classList.add('modal-title-search');
      title.setAttribute('role','link');
      title.setAttribute('tabindex','0');
      title.setAttribute('aria-label',`Search Google for ${query}`);

      const openSearch = () => {
        window.open(
          'https://www.google.com/search?q=' + encodeURIComponent(query),
          '_blank',
          'noopener,noreferrer'
        );
      };

      title.addEventListener('click', openSearch);
      title.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openSearch();
        }
      });
    });
  };

  window.cinetonWireModalTitleSearch=wireTitleSearch;
  wireTitleSearch();
})();
</script>

  const rpc=async(name,body,raw=false)=>{
    const r=await fetch(CT_PUBLIC_RATINGS.url+"/functions/v1/public-ratings",{
      method:"POST",
      headers:{
        apikey:CT_PUBLIC_RATINGS.key,
        Authorization:"Bearer "+CT_PUBLIC_RATINGS.key,
        "Content-Type":"application/json",
        Accept:"application/json"
      },
      body:JSON.stringify({action:name,...body})
    });
    if(!r.ok) throw new Error("Public rating request failed.");
    const data=await r.json();
    return raw?(Array.isArray(data)?data:[]):(Array.isArray(data)?(data[0]||{}):(data||{}));
  };

  const submitRating=async(body)=>{
    const r=await fetch(CT_PUBLIC_RATINGS.url+"/functions/v1/public-ratings",{
      method:"POST",
      headers:{
        apikey:CT_PUBLIC_RATINGS.key,
        Authorization:"Bearer "+CT_PUBLIC_RATINGS.key,
        "Content-Type":"application/json",
        Accept:"application/json"
      },
      body:JSON.stringify({action:"submit_public_rating",...body})
    });
    if(!r.ok) throw new Error("Public rating request failed.");
    return await r.json();
  };

  const formatRating=v=>{
    if(v===null || v===undefined || v==="") return "";
    const n=Number(v);
    return Number.isFinite(n)?n.toFixed(1):"";
  };

  const updateChip=(dialog,data)=>{
  const chips=dialog.querySelector(".chips");
  if(!chips)return;
  const slot=chips.querySelector(".modal-public-rating-slot");
  chips.querySelector(".cineton-public-rating-chip")?.remove();
  if(slot)slot.innerHTML="";
  const value=formatRating(data?.public_rating);
  if(!value)return;
  const chip=document.createElement("span");
  chip.className="my-chip cineton-public-rating-chip";
  chip.setAttribute("aria-label","Public Rating "+value+" out of 10");
  chip.textContent="Public Rating "+value+"/10";
  if(slot)slot.appendChild(chip);
  else chips.appendChild(chip);
};

  const loadRating=async(dialog,mediaId,apply=true)=>{
    try{
      const data=await rpc("get_public_rating",{
        p_media_item_id:String(mediaId),
        p_client_id:clientId
      });
      if(apply)updateChip(dialog,data);
      return data;
    }catch{
      return null;
    }
  };

  const closeLayer=(layer,pickedButton=null)=>{
    if(!layer || layer.dataset.closing==="true")return;
    const dialog=layer.closest(".cinemodal");
    layer.dataset.closing="true";
    if(pickedButton){
      layer.classList.add("is-picked");
      const buttons=[...layer.querySelectorAll(".cineton-rating-number")];
      buttons.forEach(b=>{b.disabled=true});
      buttons.filter(b=>b!==pickedButton).forEach((b,i)=>{
        b.classList.add("is-fading");
        b.style.transitionDelay=(i*5)+"ms";
      });
      pickedButton.classList.add("is-selected","is-final");
      pickedButton.style.transitionDelay="0ms";
      /* Keep the chosen number visible briefly after the others disappear. */
      window.setTimeout(()=>{
        if(!layer.isConnected)return;
        layer.classList.remove("is-picked");
        layer.classList.add("is-closing");
        window.setTimeout(()=>{
          if(layer.isConnected)layer.remove();
          dialog?.querySelector(".modal-top .poster-wrap img")?.focus?.({preventScroll:true});
        },180);
      },320);
      return;
    }
    layer.classList.add("is-closing");
    window.setTimeout(()=>{
      if(layer.isConnected)layer.remove();
      dialog?.querySelector(".modal-top .poster-wrap img")?.focus?.({preventScroll:true});
    },180);
  };

  const openRatingLayer=async(dialog,mediaId)=>{
    if(dialog.querySelector(".cineton-rating-layer"))return;

    const layer=document.createElement("div");
    layer.className="cineton-rating-layer";
    layer.setAttribute("role","presentation");

    const card=document.createElement("div");
    card.className="cineton-rating-card";
    card.setAttribute("role","dialog");
    card.setAttribute("aria-modal","true");
    card.setAttribute("aria-label","Choose a public rating from 1 to 10");

    const grid=document.createElement("div");
    grid.className="cineton-rating-grid";

    const currentRating=0;
    for(let n=1;n<=10;n++){
      const button=document.createElement("button");
      button.type="button";
      button.className="cineton-rating-number"+(n===currentRating?" is-selected":"");
      button.textContent=String(n);
      button.setAttribute("aria-label","Rate "+n+" out of 10");
      if(n===currentRating)button.setAttribute("aria-pressed","true");
      button.addEventListener("click",async()=>{
        if(layer.dataset.closing==="true")return;
        grid.querySelectorAll("button").forEach(b=>b.disabled=true);
        button.classList.add("is-selected");
        button.setAttribute("aria-pressed","true");
        closeLayer(layer,button);

        try{
          const data=await submitRating({
            p_media_item_id:String(mediaId),
            p_client_id:clientId,
            p_rating:n
          });
          updateChip(dialog,data);
        }catch{
          // The layer has already closed visually; the next open will reload the saved rating.
        }
      });
      grid.appendChild(button);
    }

    card.appendChild(grid);
    layer.appendChild(card);
    dialog.appendChild(layer);

    // Align the card's motion origin with the poster center so the opening feels poster-born.
    const poster=dialog.querySelector(".modal-top .poster-wrap img");
    if(poster){
      const pr=poster.getBoundingClientRect();
      const dr=dialog.getBoundingClientRect();
      layer.style.setProperty("--poster-x", (pr.left + pr.width/2 - dr.left) + "px");
      layer.style.setProperty("--poster-y", (pr.top + pr.height/2 - dr.top) + "px");
    }

    const cardRect=card.getBoundingClientRect();
    const dialogRect=dialog.getBoundingClientRect();
    const posterCenterX=Number.parseFloat(layer.style.getPropertyValue("--poster-x"));
    const posterCenterY=Number.parseFloat(layer.style.getPropertyValue("--poster-y"));
    if(Number.isFinite(posterCenterX) && Number.isFinite(posterCenterY)){
      const cardCenterX=cardRect.left+cardRect.width/2-dialogRect.left;
      const cardCenterY=cardRect.top+cardRect.height/2-dialogRect.top;
      card.style.setProperty("--poster-dx",(posterCenterX-cardCenterX)+"px");
      card.style.setProperty("--poster-dy",(posterCenterY-cardCenterY)+"px");
      card.style.transformOrigin="center";
    }

    layer.addEventListener("click",ev=>{
      if(ev.target===layer)closeLayer(layer);
    });
    layer.addEventListener("keydown",ev=>{
      if(ev.key==="Escape"){
        ev.preventDefault();
        ev.stopPropagation();
        closeLayer(layer);
      }
    });

    const focusButton=grid.querySelector(".is-selected")||grid.querySelector("button");
    requestAnimationFrame(()=>focusButton?.focus({preventScroll:true}));

    loadRating(dialog,mediaId).then(data=>{
      const own=Number(data?.own_rating);
      grid.querySelectorAll("button").forEach(b=>{
        const n=Number(b.textContent);
        const selected=n===own;
        b.classList.toggle("is-selected",selected);
        if(selected)b.setAttribute("aria-pressed","true");
        else b.removeAttribute("aria-pressed");
      });
    });
  };

  document.addEventListener("click",ev=>{
    const dialog=ev.target.closest(".cinemodal");
    if(!dialog)return;
    const layer=dialog.querySelector(".cineton-rating-layer");
    if(layer && ev.target.closest(".cinemodal .x")){
      closeLayer(layer);
    }
  },true);

  const wireDynamicPosters=()=>{
    document.querySelectorAll(".cinemodal .modal-top .poster-wrap img").forEach(img=>{
      if(img.dataset.publicRatingWired==="true")return;
      const dialog=img.closest(".cinemodal");
      if(!dialog)return;
      img.dataset.publicRatingWired="true";
      img.setAttribute("role","button");
      img.setAttribute("tabindex","0");
      img.setAttribute("aria-label","Open public rating");
      const open=()=>{
        const mediaId=dialog.dataset.sourceMovieId;
        if(mediaId)openRatingLayer(dialog,mediaId);
      };
      img.addEventListener("click",open);
      img.addEventListener("keydown",ev=>{
        if(ev.key==="Enter"||ev.key===" "){
          ev.preventDefault();
          open();
        }
      });
      // Load existing community rating as soon as the movie modal appears.
      // Previously this ran only after visitors tapped the poster to open the rating picker.
      const mediaId=dialog.dataset.sourceMovieId;
      if(mediaId)loadRating(dialog,mediaId);
    });
  };

  window.cinetonWirePublicRatingPoster=wireDynamicPosters;
  wireDynamicPosters();

  window.cinetonLoadPublicRating=loadRating;
})();
</script>

  document.body.appendChild(dialog);
  const list=dialog.querySelector(".suggestion-list"),form=dialog.querySelector("form"),input=dialog.querySelector("#suggestionInput"),submit=dialog.querySelector(".suggestion-submit"),msg=dialog.querySelector(".suggestion-message");
  let libraryRows=[];
  const normalizeTitle=v=>String(v??"").normalize("NFKD").toLocaleLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const escapeXml=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const textMetrics=()=>{
    const cs=getComputedStyle(input);
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d");
    if(!ctx)return{width:0,fontSize:14,lineHeight:20};
    ctx.font=[cs.fontStyle,cs.fontVariant,cs.fontWeight,cs.fontSize,cs.fontFamily].filter(Boolean).join(" ");
    const width=ctx.measureText(input.value).width;
    const fontSize=parseFloat(cs.fontSize)||14;
    const lineHeight=parseFloat(cs.lineHeight)||fontSize*1.45;

  };
  const ghostSvgText=(suffix,x,color="#cdbfaf")=>{

<script id="cineton-scroll-progress-script-v1">
(function(){
  if(document.getElementById('cineton-scroll-progress'))return;
  const bar=document.createElement('div');
  bar.id='cineton-scroll-progress';
  bar.setAttribute('aria-hidden','true');
  document.body.appendChild(bar);
  const fill=document.createElement('span');
  fill.style.cssText='display:block;width:100%;height:100%;transform:scaleX(0);transform-origin:left center;background:linear-gradient(90deg,#79b99a 0%,#a6c99a 58%,#b4c4b9 100%);';
  bar.replaceChildren(fill);
  let queued=false;
  function update(){
    queued=false;
    const root=document.documentElement;
    const max=Math.max(0,root.scrollHeight-window.innerHeight);
    const progress=max>0?Math.min(1,Math.max(0,window.scrollY/max)):0;
    fill.style.transform='scaleX('+progress+')';
  }
  function schedule(){
    if(queued)return;
    queued=true;
    requestAnimationFrame(update);
  }
  window.addEventListener('scroll',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  if('ResizeObserver' in window){
    const observer=new ResizeObserver(schedule);
    observer.observe(document.documentElement);
  }
  update();
})();

<script id="cineton-search-action-controller-v1">
(()=> {
  const init = () => {
    const input = document.getElementById('q');
    if (!input || input.dataset.actionButtonReady === '1') return;
    input.dataset.actionButtonReady = '1';
    const wrap = document.createElement('div');
    wrap.className = 'cineton-search-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'cineton-search-action';
    button.setAttribute('aria-label', 'Search');
    button.title = 'Search';
    wrap.appendChild(button);
    const searchIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.2 4.2"></path></svg>';
    const clearIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>';
    const isMobile = () => window.matchMedia('(max-width:600px)').matches;
    const sync = () => {
      const hasText = input.value.trim().length > 0;
      button.innerHTML = hasText ? clearIcon : searchIcon;
      button.setAttribute('aria-label', hasText ? 'Clear search' : 'Search');
      button.title = hasText ? 'Clear search' : 'Search';
      if (isMobile()) wrap.classList.toggle('is-expanded', hasText || document.activeElement === input);
      else wrap.classList.remove('is-expanded');
    };
    input.addEventListener('focus', sync);
    input.addEventListener('blur', () => {
      window.setTimeout(sync, 80);
    });
    button.addEventListener('click', () => {
      if (input.value.length) {
        input.value = '';
        input.dispatchEvent(new Event('input', {bubbles:true}));
        input.focus();
      } else {
        input.focus();
        if (typeof window.render === 'function') window.render();
      }
      sync();
    });
    input.addEventListener('input', sync);
    sync();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once:true});
  else init();
})();
</script>

<script id="cineton-dual-theme-controller-v2">
(()=>{
  const root=document.documentElement;
  const key="cineton-theme";
  const button=document.getElementById("cineton-theme-toggle");
  const apply=(mode)=>{
    const theme=mode==="dark"?"dark":"light";
    root.dataset.theme=theme;
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute("content",theme==="dark"?"#101b18":"#f2f5f0");
    if(button){
      button.innerHTML=theme==="dark"
        ?'<span class="theme-icon" aria-hidden="true">☀</span>'
        :'<span class="theme-icon" aria-hidden="true">☾</span>';
      button.setAttribute("aria-label",theme==="dark"?"Switch to light mode":"Switch to dark mode");
      button.setAttribute("aria-pressed",String(theme==="dark"));
      button.title=theme==="dark"?"Switch to light appearance":"Switch to dark appearance";
    }
    try{localStorage.setItem(key,theme)}catch(e){}
  };
  let saved="light";
  try{saved=localStorage.getItem(key)||"light"}catch(e){}
  apply(saved);
  if(button){
    button.addEventListener("click",()=>{
      apply(root.dataset.theme==="dark"?"light":"dark");
    });
  }
})();
</script>

<script id="cineton-keyboard-discovery-v1">
(()=>{
 const input=document.getElementById('q');
 if(!input)return;
 document.addEventListener('keydown',event=>{
   if(event.defaultPrevented||event.altKey||event.ctrlKey||event.metaKey)return;
   const active=document.activeElement;
   const typing=active&&(active.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName));
   if(event.key==='/'&&!typing&&!document.querySelector('dialog[open]')){
     event.preventDefault();
     document.querySelector('.bar')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
     input.focus({preventScroll:true});
   }else if(event.key==='Escape'&&active===input&&input.value){
     input.value='';
     input.dispatchEvent(new Event('input',{bubbles:true}));
     input.focus({preventScroll:true});
   }
 });
})();
</script>

<script id="cineton-nav-liquid-indicator-controller-v2">
(()=>{
 const dock=document.getElementById('cineton-bottom-nav');
 if(!dock)return;
 let indicator=dock.querySelector('.ct-nav-liquid-indicator');
 if(!indicator){indicator=document.createElement('span');indicator.className='ct-nav-liquid-indicator';indicator.setAttribute('aria-hidden','true');dock.appendChild(indicator);}
 if(dock.dataset.liquidIndicatorReady==='2')return;
 dock.dataset.liquidIndicatorReady='2';
 let frame=0,lastActive=null;
 const move=()=>{
   frame=0;
   const active=dock.querySelector('button[data-destination].is-active,button[data-destination][aria-current="page"]');
   if(!active||!active.getClientRects().length)return;
   const d=dock.getBoundingClientRect(),b=active.getBoundingClientRect();
   const x=b.left-d.left-dock.clientLeft,y=b.top-d.top-dock.clientTop;
   if(active!==lastActive){indicator.style.borderRadius=getComputedStyle(active).borderRadius||'15px';lastActive=active;}
   indicator.style.width=b.width+'px';
   indicator.style.height=b.height+'px';
   indicator.style.transform='translate3d('+x+'px,'+y+'px,0)';
   indicator.classList.add('is-ready');
 };
 const schedule=()=>{if(!frame)frame=requestAnimationFrame(move)};
 const observer=new MutationObserver(schedule);
 observer.observe(dock,{subtree:true,attributes:true,attributeFilter:['class','aria-current','style']});
 dock.addEventListener('click',schedule,{passive:true});
 window.addEventListener('resize',schedule,{passive:true});
 window.addEventListener('scroll',schedule,{passive:true,capture:true});
 if(window.visualViewport){window.visualViewport.addEventListener('resize',schedule,{passive:true});window.visualViewport.addEventListener('scroll',schedule,{passive:true});}
 if('ResizeObserver'in window){const ro=new ResizeObserver(schedule);ro.observe(dock);dock.querySelectorAll('button[data-destination]').forEach(b=>ro.observe(b));}
 requestAnimationFrame(()=>requestAnimationFrame(move));
})();
</script>
