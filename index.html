<style id="mobile-genre-menu-balance-v1">
/* Mobile genre menu — keep every option inside the viewport and prevent text overflow. */
@media(max-width:600px){
  .bar>.select-wrap{
    min-width:0!important;
    max-width:100%!important;
  }
  .bar>.select-wrap .select-menu{
    left:0!important;
    right:auto!important;
    width:max-content!important;
    min-width:140px!important;
    max-width:calc(100vw - 24px)!important;
    box-sizing:border-box!important;
    overflow-x:hidden!important;
  }
  .bar>.select-wrap .select-menu button{
    min-width:0!important;
    max-width:100%!important;
    box-sizing:border-box!important;
    white-space:normal!important;
    overflow-wrap:anywhere!important;
    word-break:break-word!important;
  }
  .bar>.select-wrap .select-menu button::after{
    flex:0 0 auto!important;
    margin-left:8px!important;
  }
}
</style>
<style id="public-comments-typography-contrast-v2">
/* Public comments — balanced desktop hierarchy with stronger warm-theme contrast. */
.public-comments{
  border-color:color-mix(in srgb,var(--tx) 34%,var(--line-strong))!important;
  background:color-mix(in srgb,var(--sf) 52%,var(--modal))!important;
}
.public-comments-head{
  color:var(--tx)!important;
  font-family:"Mina",sans-serif!important;
  font-size:.70rem!important;
  line-height:1.35!important;
  font-weight:700!important;
  letter-spacing:.035em!important;
}
.public-comments-count{
  color:var(--tx)!important;
  font-size:.63rem!important;
  font-weight:600!important;
  opacity:1!important;
}
.public-comment{
  color:var(--tx)!important;
  font-family:"Mina",sans-serif!important;
  font-size:.74rem!important;
  line-height:1.56!important;
  font-weight:400!important;
  background:color-mix(in srgb,var(--modal) 72%,var(--sf))!important;
  border:1px solid color-mix(in srgb,var(--line-strong) 76%,transparent);
}
.public-comment-mark{
  color:var(--tx)!important;
  opacity:.82!important;
}
.public-comment-name,
.public-comment-text{
  color:var(--tx)!important;
}
.public-comment-name{font-weight:700!important}
.public-comments-head::after{
  color:var(--tx)!important;
  opacity:.9!important;
}
.public-comments.open .public-comments-head::after{
  color:var(--ac)!important;
  opacity:1!important;
}
.public-comment-composer{
  border-color:color-mix(in srgb,var(--tx) 28%,var(--ac))!important;
  background:color-mix(in srgb,var(--modal) 88%,var(--sf))!important;
}
.public-comment-composer input,
.public-comment-composer textarea{
  color:var(--tx)!important;
  font-family:"Mina",sans-serif!important;
  font-size:.72rem!important;
  line-height:1.52!important;
}
.public-comment-composer input::placeholder,
.public-comment-composer textarea::placeholder{
  color:var(--mu)!important;
  opacity:1!important;
}
.public-comment-submit{
  color:var(--ac)!important;
  opacity:1!important;
}
@media(max-width:639px){
  .public-comments{
    border-color:var(--line-strong)!important;
  }
  .public-comments-head{
    font-size:.64rem!important;
    letter-spacing:.035em!important;
  }
  .public-comments-count{font-size:.59rem!important}
  .public-comment{
    font-size:.68rem!important;
    line-height:1.52!important;
  }
  .public-comment-composer input,
  .public-comment-composer textarea{
    font-size:.66rem!important;
    line-height:1.5!important;
  }
}
</style>
<style id="desktop-modal-motion-clean-v1">
/* Desktop modal open/close: intentionally instant. Mobile animation remains untouched. */
@media(min-width:601px){
  .cinemodal,
  .cinemodal[open],
  .cinemodal.modal-origin,
  .cinemodal.modal-origin[open],
  .cinemodal.modal-origin.modal-origin-ready[open],
  .cinemodal.modal-returning,
  .cinemodal.modal-returning[open]{
    opacity:1!important;
    transform:none!important;
    transition:none!important;
    animation:none!important;
    will-change:auto!important;
  }
}
@media(prefers-reduced-motion:reduce){
  .cinemodal{transition:none!important;animation:none!important}
}
</style>

<script id="modal-title-google-search-v1">
(()=> {
  const wireTitleSearch = () => {
    document.querySelectorAll('.cinemodal .detail-head h2').forEach(title => {
      if (title.dataset.googleSearchWired === 'true') return;
      const titleText = title.textContent.trim();
      if (!titleText) return;

      const subline = title.closest('.detail-head')?.querySelector('.subline');
      const year = subline?.textContent.trim().match(/^(\d{4})/)?.[1] || '';
      const query = year ? titleText + ' ' + year : titleText;

      title.dataset.googleSearchWired = 'true';
      title.classList.add('modal-title-search');
      title.setAttribute('role','link');
      title.setAttribute('tabindex','0');
      title.setAttribute('aria-label',`Search Google for ${query}`);

      const openSearch = () => {
        window.open(
          'https://www.google.com/search?q=' + encodeURIComponent(query),
          '_blank',
          'noopener,noreferrer'
        );
      };

      title.addEventListener('click', openSearch);
      title.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openSearch();
        }
      });
    });
  };

  const observer = new MutationObserver(wireTitleSearch);
  observer.observe(document.body, {childList:true, subtree:true});
  wireTitleSearch();
})();
</script>

<script id="public-rating-layer-v1">
(()=> {
  const CT_PUBLIC_RATINGS={
    url:"https://osplbqpgxrfovjrumsnb.supabase.co",
    key:"sb_"+"publishable_"+"tcBaC8FqwlcFFw-IwKmiVA_y67PZNPX"
  };

  const getClientId=()=>{
    const key="cineton-public-rating-client";
    try{
      let id=localStorage.getItem(key);
      if(id && /^[0-9a-f-]{36}$/i.test(id)) return id;
      id=crypto.randomUUID();
      localStorage.setItem(key,id);
      return id;
    }catch{
      try{
        let id=sessionStorage.getItem(key);
        if(id && /^[0-9a-f-]{36}$/i.test(id)) return id;
        id=crypto.randomUUID();
        sessionStorage.setItem(key,id);
        return id;
      }catch{
        return crypto.randomUUID();
      }
    }
  };

  const clientId=getClientId();

  const rpc=async(name,body,raw=false)=>{
    const r=await fetch(CT_PUBLIC_RATINGS.url+"/rest/v1/rpc/"+name,{
      method:"POST",
      headers:{
        apikey:CT_PUBLIC_RATINGS.key,
        "Content-Type":"application/json",
        Accept:"application/json"
      },
      body:JSON.stringify(body)
    });
    if(!r.ok) throw new Error("Public rating request failed.");
    const data=await r.json();
    return raw?(Array.isArray(data)?data:[]):(Array.isArray(data)?(data[0]||{}):(data||{}));
  };

  const formatRating=v=>{
    if(v===null || v===undefined || v==="") return "";
    const n=Number(v);
    return Number.isFinite(n)?n.toFixed(1):"";
  };

  const updateChip=(dialog,data)=>{
  const chips=dialog.querySelector(".chips");
  if(!chips)return;
  const slot=chips.querySelector(".modal-public-rating-slot");
  chips.querySelector(".cineton-public-rating-chip")?.remove();
  if(slot)slot.innerHTML="";
  const value=formatRating(data?.public_rating);
  if(!value)return;
  const chip=document.createElement("span");
  chip.className="my-chip cineton-public-rating-chip";
  chip.setAttribute("aria-label","Public Rating "+value+" out of 10");
  chip.textContent="Public Rating "+value+"/10";
  if(slot)slot.appendChild(chip);
  else chips.appendChild(chip);
};

  const loadRating=async(dialog,mediaId,apply=true)=>{
    try{
      const data=await rpc("get_public_rating",{
        p_media_item_id:String(mediaId),
        p_client_id:clientId
      });
      if(apply)updateChip(dialog,data);
      return data;
    }catch{
      return null;
    }
  };

  const closeLayer=(layer,pickedButton=null)=>{
    if(!layer || layer.dataset.closing==="true")return;
    const dialog=layer.closest(".cinemodal");
    layer.dataset.closing="true";
    if(pickedButton)pickedButton.classList.add("is-picked");
    layer.classList.add("is-closing");
    const done=()=>{
      if(layer.isConnected)layer.remove();
      dialog?.querySelector(".modal-top .poster-wrap img")?.focus?.({preventScroll:true});
    };
    window.setTimeout(done,260);
  };

  const openRatingLayer=async(dialog,mediaId)=>{
    if(dialog.querySelector(".cineton-rating-layer"))return;

    const layer=document.createElement("div");
    layer.className="cineton-rating-layer";
    layer.setAttribute("role","presentation");

    const card=document.createElement("div");
    card.className="cineton-rating-card";
    card.setAttribute("role","dialog");
    card.setAttribute("aria-modal","true");
    card.setAttribute("aria-label","Choose a public rating from 1 to 10");

    const grid=document.createElement("div");
    grid.className="cineton-rating-grid";

    const currentRating=0;
    for(let n=1;n<=10;n++){
      const button=document.createElement("button");
      button.type="button";
      button.className="cineton-rating-number"+(n===currentRating?" is-selected":"");
      button.textContent=String(n);
      button.setAttribute("aria-label","Rate "+n+" out of 10");
      if(n===currentRating)button.setAttribute("aria-pressed","true");
      button.addEventListener("click",async()=>{
        if(layer.dataset.closing==="true")return;
        grid.querySelectorAll("button").forEach(b=>b.disabled=true);
        button.classList.add("is-selected");
        button.setAttribute("aria-pressed","true");

        // Start the visual return immediately; do not make the animation wait for the network.
        const posterCenter=poster ? poster.getBoundingClientRect() : null;
        if(posterCenter){
          const br=button.getBoundingClientRect();
          button.style.setProperty("--to-poster-x",(posterCenter.left+posterCenter.width/2)-(br.left+br.width/2)+"px");
          button.style.setProperty("--to-poster-y",(posterCenter.top+posterCenter.height/2)-(br.top+br.height/2)+"px");
        }
        grid.querySelectorAll("button").forEach((b,i)=>{
          if(b!==button){
            const direction=i<5?-1:1;
            b.style.setProperty("--exit-x",(direction*(8+Math.abs(i-4.5)*2))+"px");
          }
        });
        closeLayer(layer,button);

        try{
          const data=await rpc("submit_public_rating",{
            p_media_item_id:String(mediaId),
            p_client_id:clientId,
            p_rating:n
          });
          updateChip(dialog,data);
        }catch{
          // The layer has already closed visually; the next open will reload the saved rating.
        }
      });
      grid.appendChild(button);
    }

    card.appendChild(grid);
    layer.appendChild(card);
    dialog.appendChild(layer);

    // Align the card's motion origin with the poster center so the opening feels poster-born.
    const poster=dialog.querySelector(".modal-top .poster-wrap img");
    if(poster){
      const pr=poster.getBoundingClientRect();
      const dr=dialog.getBoundingClientRect();
      layer.style.setProperty("--poster-x", (pr.left + pr.width/2 - dr.left) + "px");
      layer.style.setProperty("--poster-y", (pr.top + pr.height/2 - dr.top) + "px");
    }

    const cardRect=card.getBoundingClientRect();
    const dialogRect=dialog.getBoundingClientRect();
    const posterCenterX=Number.parseFloat(layer.style.getPropertyValue("--poster-x"));
    const posterCenterY=Number.parseFloat(layer.style.getPropertyValue("--poster-y"));
    if(Number.isFinite(posterCenterX) && Number.isFinite(posterCenterY)){
      const cardCenterX=cardRect.left+cardRect.width/2-dialogRect.left;
      const cardCenterY=cardRect.top+cardRect.height/2-dialogRect.top;
      card.style.setProperty("--poster-dx",(posterCenterX-cardCenterX)+"px");
      card.style.setProperty("--poster-dy",(posterCenterY-cardCenterY)+"px");
      card.style.transformOrigin="center";
    }

    // Drive opening with the browser's compositor animation API for deterministic 500ms timing.
    const reducedMotion=window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
    const openingDuration=reducedMotion?0:90;
    const posterDx=card.style.getPropertyValue("--poster-dx")||"0px";
    const posterDy=card.style.getPropertyValue("--poster-dy")||"0px";
    layer.animate(
      [{opacity:0},{opacity:1}],
      {duration:openingDuration,easing:"ease-out",fill:"both"}
    );
    card.animate(
      [
        {opacity:0,transform:"translate3d("+posterDx+","+posterDy+",0) scale(.97)"},
        {opacity:1,transform:"translate3d(0,0,0) scale(1)"}
      ],
      {duration:openingDuration,easing:"cubic-bezier(.2,.7,.25,1)",fill:"both"}
    );

    layer.addEventListener("click",ev=>{
      if(ev.target===layer)closeLayer(layer);
    });
    layer.addEventListener("keydown",ev=>{
      if(ev.key==="Escape"){
        ev.preventDefault();
        ev.stopPropagation();
        closeLayer(layer);
      }
    });

    const focusButton=grid.querySelector(".is-selected")||grid.querySelector("button");
    requestAnimationFrame(()=>focusButton?.focus({preventScroll:true}));

    loadRating(dialog,mediaId).then(data=>{
      const own=Number(data?.own_rating);
      grid.querySelectorAll("button").forEach(b=>{
        const n=Number(b.textContent);
        const selected=n===own;
        b.classList.toggle("is-selected",selected);
        if(selected)b.setAttribute("aria-pressed","true");
        else b.removeAttribute("aria-pressed");
      });
    });
  };

    document.querySelectorAll(".cinemodal .modal-top .poster-wrap img").forEach(img=>{

      img.setAttribute("tabindex","0");
      img.setAttribute("aria-label","Open public rating");
      const open=()=>{
        const mediaId=dialog.dataset.sourceMovieId;
        if(mediaId)openRatingLayer(dialog,mediaId);
      };
      img.addEventListener("click",open);
      img.addEventListener("keydown",ev=>{
        if(ev.key==="Enter"||ev.key===" "){
          ev.preventDefault();
          open();
        }
      });
    });
  };

  document.addEventListener("click",ev=>{
    const dialog=ev.target.closest(".cinemodal");
    if(!dialog)return;
    const layer=dialog.querySelector(".cineton-rating-layer");
    if(layer && ev.target.closest(".cinemodal .x")){
      closeLayer(layer);
    }
  },true);

  const wireDynamicPosters=()=>{
    document.querySelectorAll(".cinemodal .modal-top .poster-wrap img").forEach(img=>{
      if(img.dataset.publicRatingWired==="true")return;
      const dialog=img.closest(".cinemodal");
      if(!dialog)return;
      img.dataset.publicRatingWired="true";
      img.setAttribute("role","button");
      img.setAttribute("tabindex","0");
      img.setAttribute("aria-label","Open public rating");
      const open=()=>{
        const mediaId=dialog.dataset.sourceMovieId;
        if(mediaId)openRatingLayer(dialog,mediaId);
      };
      img.addEventListener("click",open);
      img.addEventListener("keydown",ev=>{
        if(ev.key==="Enter"||ev.key===" "){
          ev.preventDefault();
          open();
        }
      });
    });
  };

  const posterObserver=new MutationObserver(wireDynamicPosters);
  posterObserver.observe(document.body,{childList:true,subtree:true});
  wireDynamicPosters();

  window.cinetonLoadPublicRating=loadRating;
})();
</script>
